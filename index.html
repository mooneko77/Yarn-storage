<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛線倉庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body {
            background-color: #FFFDF9;
            color: #5C5446;
        }
    </style>
</head>
<body class="font-sans pb-24 md:pb-8 selection:bg-amber-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let db = null;
        let auth = null;
        let isFirebaseActive = false;

        if (Object.keys(firebaseConfig).length > 0) {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                auth = firebase.auth();
                db = firebase.firestore();
                isFirebaseActive = true;
            } catch (e) {
                console.warn("Firebase initialization fallback to localStorage", e);
            }
        }

        function toDateLocal(timestamp) {
            const d = new Date(timestamp || Date.now());
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        // Autocomplete Input Component
        function AutocompleteInput({ label, name, value, options, onChange, placeholder, required }) {
            const [isOpen, setIsOpen] = useState(false);
            const inputRef = useRef(null);

            const filteredOptions = options.filter(opt =>
                opt.toLowerCase().includes((value || '').toLowerCase()) && opt !== value
            );

            return (
                <div className="space-y-1.5 relative">
                    <label className="text-xs font-bold text-amber-900/70">
                        {label} {required && <span className="text-rose-400">*</span>}
                    </label>
                    <div className="relative">
                        <input
                            ref={inputRef}
                            type="text"
                            name={name}
                            value={value}
                            onChange={(e) => {
                                onChange(e);
                                setIsOpen(true);
                            }}
                            onFocus={() => setIsOpen(true)}
                            onBlur={() => setIsOpen(false)}
                            placeholder={placeholder}
                            required={required}
                            className="w-full px-4 py-3 rounded-2xl bg-amber-50/50 border border-amber-100 focus:ring-2 focus:ring-amber-300 outline-none text-sm text-amber-900 font-medium"
                        />
                    </div>

                    {isOpen && filteredOptions.length > 0 && (
                        <div className="absolute z-50 w-full mt-1 bg-white border border-amber-100 rounded-2xl shadow-lg max-h-48 overflow-y-auto py-1">
                            {filteredOptions.map(opt => (
                                <div
                                    key={opt}
                                    onMouseDown={(e) => {
                                        e.preventDefault();
                                        onChange({ target: { name, value: opt } });
                                        setIsOpen(false);
                                        inputRef.current?.blur();
                                    }}
                                    className="px-4 py-2 text-sm text-amber-900 hover:bg-amber-50 cursor-pointer transition-colors"
                                >
                                    {opt}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [yarns, setYarns] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [activeFilter, setActiveFilter] = useState('全部');
            
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [currentImageBase64, setCurrentImageBase64] = useState('');
            const [currentEditingHistory, setEditingHistory] = useState([]);
            
            const [formData, setFormData] = useState({
                brand: '',
                color: '',
                category: '',
                material: '',
                quantity: 1,
                price: 0,
                createdAtInput: toDateLocal(Date.now())
            });

            const fileInputRef = useRef(null);
            const imageInputRef = useRef(null);

            useEffect(() => {
                if (isFirebaseActive && auth) {
                    const initAuth = async () => {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await auth.signInWithCustomToken(__initial_auth_token);
                            } else {
                                await auth.signInAnonymously();
                            }
                        } catch (e) {
                            console.warn("Auth failed, using local storage", e);
                            fallbackLocalStorage();
                        }
                    };
                    initAuth();

                    const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
                        setUser(currentUser);
                        if (currentUser && db) {
                            const yarnsRef = db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('yarns');
                            yarnsRef.onSnapshot((snapshot) => {
                                const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                data.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                                setYarns(data);
                                setLoading(false);
                            }, (err) => {
                                console.warn("Firestore snapshot error, falling back", err);
                                fallbackLocalStorage();
                            });
                        } else {
                            fallbackLocalStorage();
                        }
                    });
                    return () => unsubscribeAuth();
                } else {
                    fallbackLocalStorage();
                }
            }, []);

            function fallbackLocalStorage() {
                try {
                    const localData = JSON.parse(localStorage.getItem('yarn_warehouse_data') || '[]');
                    setYarns(localData);
                } catch(e) {
                    setYarns([]);
                }
                setLoading(false);
            }

            function saveToStorage(newYarns) {
                setTimeout(() => {
                    setYarns(newYarns);
                }, 0);
                try {
                    localStorage.setItem('yarn_warehouse_data', JSON.stringify(newYarns));
                } catch(e) {}
            }

            const categories = useMemo(() => {
                const cats = new Set(yarns.map(y => y.category?.trim() || '未分類'));
                return ['全部', ...Array.from(cats)];
            }, [yarns]);

            const existingBrands = useMemo(() => Array.from(new Set(yarns.map(y => y.brand?.trim()).filter(Boolean))), [yarns]);
            const existingColors = useMemo(() => Array.from(new Set(yarns.map(y => y.color?.trim()).filter(Boolean))), [yarns]);
            const existingCategories = useMemo(() => Array.from(new Set(yarns.map(y => y.category?.trim()).filter(Boolean))), [yarns]);
            const existingMaterials = useMemo(() => Array.from(new Set(yarns.map(y => y.material?.trim()).filter(Boolean))), [yarns]);

            const filteredYarns = useMemo(() => {
                return yarns.filter(yarn => {
                    const matchSearch = (yarn.color || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
                        (yarn.brand || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (yarn.category || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (yarn.material || '').toLowerCase().includes(searchTerm.toLowerCase());
                    
                    const itemCat = yarn.category?.trim() || '未分類';
                    const matchFilter = activeFilter === '全部' || itemCat === activeFilter;
                    return matchSearch && matchFilter;
                });
            }, [yarns, searchTerm, activeFilter]);

            const stats = useMemo(() => {
                return yarns.reduce((acc, y) => ({
                    totalItems: acc.totalItems + Number(y.quantity || 0),
                    totalValue: acc.totalValue + (Number(y.quantity || 0) * Number(y.price || 0))
                }), { totalItems: 0, totalValue: 0 });
            }, [yarns]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 400;
                        let size = Math.min(img.width, img.height);
                        let sx = (img.width - size) / 2;
                        let sy = (img.height - size) / 2;
                        canvas.width = MAX_SIZE;
                        canvas.height = MAX_SIZE;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, sx, sy, size, size, 0, 0, MAX_SIZE, MAX_SIZE);
                        setCurrentImageBase64(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
                reader.readAsDataURL(file);
                if (imageInputRef.current) imageInputRef.current.value = '';
            };

            const openAddForm = () => {
                setEditingId(null);
                setCurrentImageBase64('');
                setEditingHistory([]);
                setFormData({ brand: '', color: '', category: '', material: '', quantity: 1, price: 0, createdAtInput: toDateLocal(Date.now()) });
                setIsFormOpen(true);
            };

            const openEditForm = (yarn) => {
                setEditingId(yarn.id);
                setCurrentImageBase64(yarn.imageUrl || '');
                setEditingHistory([...(yarn.history || [])]);
                setFormData({
                    brand: yarn.brand || '',
                    color: yarn.color || '',
                    category: yarn.category || '',
                    material: yarn.material || '',
                    quantity: yarn.quantity || 0,
                    price: yarn.price || 0,
                    createdAtInput: toDateLocal(yarn.createdAt || Date.now())
                });
                setIsFormOpen(true);
            };

            const saveYarn = (e) => {
                e.preventDefault();
                const newQty = Math.max(0, Number(formData.quantity));
                const createdAtVal = formData.createdAtInput ? new Date(formData.createdAtInput).getTime() : Date.now();
                let history = [...currentEditingHistory];
                if (!editingId && history.length === 0) {
                    history.unshift({ action: `建立商品 (數量: ${newQty})`, time: toDateLocal(Date.now()) });
                }

                const yarnData = {
                    id: editingId || 'yarn_' + Date.now(),
                    brand: formData.brand.trim() || '',
                    color: formData.color.trim() || '',
                    category: formData.category.trim() || '',
                    material: formData.material.trim() || '',
                    quantity: newQty,
                    price: Math.max(0, Number(formData.price)),
                    imageUrl: currentImageBase64,
                    history: history,
                    createdAt: createdAtVal,
                    updatedAt: Date.now()
                };

                if (editingId) {
                    const updated = yarns.map(y => y.id === editingId ? yarnData : y);
                    saveToStorage(updated);
                    if (isFirebaseActive && user && db) {
                        db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('yarns').doc(editingId).set(yarnData).catch(err => console.error(err));
                    }
                } else {
                    const newYarnsList = [yarnData, ...yarns];
                    saveToStorage(newYarnsList);
                    if (isFirebaseActive && user && db) {
                        db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('yarns').doc(yarnData.id).set(yarnData).catch(err => console.error(err));
                    }
                }
                setIsFormOpen(false);
            };

            const deleteCurrentYarn = () => {
                if (!editingId) return;
                const updated = yarns.filter(y => y.id !== editingId);
                saveToStorage(updated);
                if (isFirebaseActive && user && db) {
                    db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('yarns').doc(editingId).delete().catch(err => console.error(err));
                }
                setIsFormOpen(false);
            };

            const downloadTemplateCSV = () => {
                const csvContent = "\uFEFF品牌,顏色,品項,材質,數量,單價,圖片網址,建立日期\n雪球,11淺紫色,小萌仔,冰條線,1,12.5,,2026-09-02\n";
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.setAttribute('download', '毛線倉庫匯入範本.csv');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const text = event.target.result;
                        const lines = text.split('\n');
                        if (lines.length <= 1) return;

                        let newItems = [...yarns];
                        for (let i = 1; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;
                            const cols = line.split(',').map(c => c.replace(/^"(.*)"$/, '$1').trim());
                            if (cols.length >= 2) {
                                const qty = Number(cols[4]) || 0;
                                const createdAtVal = cols[7] ? new Date(cols[7]).getTime() : Date.now();
                                const newItem = {
                                    id: 'csv_' + Date.now() + '_' + i,
                                    brand: cols[0] || '',
                                    color: cols[1] || '',
                                    category: cols[2] || '',
                                    material: cols[3] || '',
                                    quantity: qty,
                                    price: Number(cols[5]) || 0,
                                    imageUrl: cols[6] || '',
                                    history: [{ action: `Excel 批次匯入 (數量: ${qty})`, time: toDateLocal(Date.now()) }],
                                    createdAt: createdAtVal,
                                    updatedAt: Date.now()
                                };
                                newItems.push(newItem);
                            }
                        }
                        saveToStorage(newItems);
                    } catch(err) {
                        console.error("CSV Import error", err);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-[#FFFDF9] flex items-center justify-center">
                        <div className="w-8 h-8 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#FFFDF9] text-[#5C5446] font-sans pb-24 md:pb-8">
                    <input type="file" id="csvFileInput" accept=".csv" className="hidden" onChange={handleCSVUpload} />
                    <input type="file" id="imageFileInput" accept="image/*" ref={imageInputRef} className="hidden" onChange={handleImageUpload} />

                    {}
                    <header className="bg-[#FFFDF9] sticky top-0 z-10 shadow-sm border-b border-amber-100">
                        <div className="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8">
                            <div className="flex flex-col sm:flex-row justify-between gap-4 sm:items-center">
                                <div className="flex items-center gap-4 flex-1">
                                    <h1 className="text-xl font-bold text-amber-900 whitespace-nowrap hidden sm:block">
                                        我的毛線
                                    </h1>
                                    <div className="relative flex-1 max-w-md">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i data-lucide="search" className="w-4 h-4 text-amber-300"></i>
                                        </div>
                                        <input
                                            type="text"
                                            placeholder="搜尋顏色、品項、品牌、材質..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="block w-full pl-10 pr-3 py-2.5 border-none rounded-full bg-amber-50/70 text-amber-900 placeholder-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300 sm:text-sm transition-shadow"
                                        />
                                    </div>
                                </div>
                                
                                <div className="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                                    <div className="flex gap-3 text-xs font-medium text-amber-800 whitespace-nowrap bg-[#FDF8ED] px-3.5 py-1.5 rounded-full border border-amber-200/60 shadow-sm">
                                        <span>共 <strong className="text-amber-900">{stats.totalItems}</strong> 件</span>
                                        <div className="w-px bg-amber-200"></div>
                                        <span>價值 <strong className="text-amber-900">¥{stats.totalValue.toLocaleString()}</strong></span>
                                    </div>
                                    
                                    <button
                                        onClick={downloadTemplateCSV}
                                        className="flex items-center gap-1 px-3 py-1.5 text-xs font-bold text-amber-800 bg-[#FDF8ED] hover:bg-amber-100/60 rounded-full transition-colors whitespace-nowrap border border-amber-200"
                                    >
                                        <i data-lucide="download" className="w-3.5 h-3.5 text-amber-600"></i>
                                        <span>匯入範本</span>
                                    </button>

                                    <button
                                        onClick={() => document.getElementById('csvFileInput').click()}
                                        className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 rounded-full transition-colors whitespace-nowrap shadow-sm shadow-amber-200"
                                    >
                                        <i data-lucide="upload" className="w-3.5 h-3.5"></i>
                                        <span>匯入 Excel</span>
                                    </button>
                                </div>
                            </div>
                            
                            <div className="mt-3 flex overflow-x-auto gap-2 pb-1 hide-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
                                {categories.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setActiveFilter(cat)}
                                        className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                                            activeFilter === cat
                                                ? 'bg-amber-400 text-white shadow-md shadow-amber-200'
                                                : 'bg-white text-amber-800 hover:bg-amber-50 border border-amber-200/70'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {}
                    <main className="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-4">
                        {filteredYarns.length === 0 ? (
                            <div className="text-center py-20">
                                <i data-lucide="package" className="w-16 h-16 text-amber-200 mx-auto mb-4"></i>
                                <h2 className="text-xl font-medium text-amber-900 mb-2">倉庫空空的</h2>
                                <p className="text-sm text-amber-700/60">點擊右下角新增，或使用 Excel 批次匯入資料。</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4">
                                {filteredYarns.map(yarn => (
                                    <div 
                                        key={yarn.id} 
                                        onClick={() => openEditForm(yarn)} 
                                        className="bg-white rounded-3xl overflow-hidden shadow-sm border border-amber-100 hover:shadow-md transition-all group flex flex-col relative cursor-pointer"
                                    >
                                        <div className="aspect-square bg-amber-50/30 relative">
                                            {yarn.imageUrl ? (
                                                <img src={yarn.imageUrl} alt="" className="w-full h-full object-cover" />
                                            ) : (
                                                <div className="w-full h-full flex items-center justify-center text-amber-200 bg-amber-50/50">
                                                    <i data-lucide="image" className="w-8 h-8"></i>
                                                </div>
                                            )}
                                            
                                            <div className="absolute top-2 left-2 bg-[#a3c959] text-white text-[11px] font-bold px-2 py-0.5 rounded-lg shadow-sm">
                                                ¥{yarn.price}
                                            </div>

                                            <div className="absolute bottom-2 right-2 z-10 bg-amber-400 text-white text-xs font-bold px-2.5 py-0.5 rounded-full shadow-sm border-2 border-white font-mono">
                                                {yarn.quantity}
                                            </div>
                                        </div>

                                        {/* Card text layout: Color on top (larger), Brand on bottom-left, Category next to brand */}
                                        <div className="p-3.5 flex flex-col flex-1 bg-white justify-between">
                                            <h3 className="text-sm sm:text-base font-bold text-amber-900 leading-snug line-clamp-1 mb-1">
                                                {yarn.color || '未命名顏色'}
                                            </h3>
                                            <div className="flex justify-between items-center text-xs text-amber-800/70">
                                                <span className="font-medium truncate mr-1">{yarn.brand || '未分類品牌'}</span>
                                                <span className="truncate">{yarn.category || ''}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {}
                    <button
                        onClick={openAddForm}
                        className="fixed bottom-6 right-6 md:bottom-8 md:right-8 bg-amber-400 hover:bg-amber-500 text-white p-4 rounded-full shadow-lg shadow-amber-300 transition-transform hover:scale-105 z-40 flex items-center justify-center border-2 border-white"
                    >
                        <i data-lucide="plus" className="w-6 h-6 stroke-[3]"></i>
                    </button>

                    {/* Add/Edit Modal (Rounded 3xl with overflow-hidden) */}
                    {isFormOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-0 sm:p-4 transition-opacity">
                            <div className="bg-[#FFFDF9] w-full max-w-md h-[90vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col border-2 border-amber-100 overflow-hidden">
                                <div className="flex items-center justify-between px-6 py-4 bg-[#FDF8ED] border-b border-amber-100 shrink-0">
                                    <h2 className="text-base font-bold text-amber-900">
                                        {editingId ? '編輯物品與紀錄' : '新增物品'}
                                    </h2>
                                    <div className="flex gap-2">
                                        {editingId && (
                                            <button 
                                                type="button"
                                                onClick={deleteCurrentYarn}
                                                className="p-2 text-rose-400 hover:bg-rose-50 rounded-full transition-colors"
                                            >
                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                        )}
                                        <button 
                                            onClick={() => setIsFormOpen(false)}
                                            className="p-2 text-amber-400 hover:bg-amber-100 rounded-full transition-colors"
                                        >
                                            <i data-lucide="x" className="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="overflow-y-auto flex-1 p-6 space-y-5">
                                    <form id="yarnForm" onSubmit={saveYarn} className="space-y-4">
                                        <div className="flex justify-center">
                                            <div 
                                                onClick={() => imageInputRef.current?.click()}
                                                className="w-32 h-32 rounded-3xl border-2 border-dashed border-amber-200 bg-amber-50/50 flex flex-col items-center justify-center cursor-pointer hover:border-amber-400 hover:bg-amber-100/50 transition-colors overflow-hidden relative group shadow-sm"
                                            >
                                                {currentImageBase64 ? (
                                                    <img src={currentImageBase64} alt="" className="w-full h-full object-cover" />
                                                ) : (
                                                    <div className="flex flex-col items-center justify-center text-amber-300">
                                                        <i data-lucide="camera" className="w-8 h-8 mb-2 text-amber-500"></i>
                                                        <span className="text-xs text-amber-600 font-bold">上傳照片</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <AutocompleteInput 
                                                label="品牌" 
                                                name="brand" 
                                                value={formData.brand} 
                                                options={existingBrands} 
                                                onChange={handleInputChange} 
                                                placeholder="請輸入品牌" 
                                            />
                                            <AutocompleteInput 
                                                label="顏色" 
                                                name="color" 
                                                value={formData.color} 
                                                options={existingColors} 
                                                onChange={handleInputChange} 
                                                placeholder="請輸入顏色" 
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <AutocompleteInput 
                                                label="品項" 
                                                name="category" 
                                                value={formData.category} 
                                                options={existingCategories} 
                                                onChange={handleInputChange} 
                                                placeholder="請輸入品項" 
                                            />
                                            <AutocompleteInput 
                                                label="材質" 
                                                name="material" 
                                                value={formData.material} 
                                                options={existingMaterials} 
                                                onChange={handleInputChange} 
                                                placeholder="請輸入材質" 
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-amber-900/70">數量</label>
                                                <input type="number" name="quantity" value={formData.quantity} onChange={handleInputChange} min="0" className="w-full px-4 py-3 rounded-2xl bg-amber-50/50 border border-amber-100 focus:ring-2 focus:ring-amber-300 outline-none text-sm font-bold text-amber-900" />
                                            </div>
                                            <div className="space-y-1.5">
                                                <label className="text-xs font-bold text-amber-900/70">單價</label>
                                                <input type="number" name="price" value={formData.price} onChange={handleInputChange} min="0" step="0.01" className="w-full px-4 py-3 rounded-2xl bg-amber-50/50 border border-amber-100 focus:ring-2 focus:ring-amber-300 outline-none text-sm font-bold text-amber-900" />
                                            </div>
                                        </div>

                                        <div className="space-y-1.5">
                                            <label className="text-xs font-bold text-amber-900/70">建立商品日期</label>
                                            <input type="date" name="createdAtInput" value={formData.createdAtInput} onChange={handleInputChange} className="w-full px-4 py-3 rounded-2xl bg-amber-50/50 border border-amber-100 focus:ring-2 focus:ring-amber-300 outline-none text-xs font-medium text-amber-900" />
                                        </div>
                                    </form>

                                    {editingId && (
                                        <div className="pt-4 border-t border-amber-100 space-y-3">
                                            <div className="flex items-center justify-between">
                                                <h3 className="text-xs font-bold text-amber-900 flex items-center gap-1.5">
                                                    <i data-lucide="package-open" className="w-4 h-4 text-amber-600"></i>
                                                    進出貨與異動紀錄
                                                </h3>
                                            </div>
                                            <div className="space-y-2 max-h-40 overflow-y-auto bg-amber-50/30 p-3 rounded-2xl border border-amber-100 text-xs text-amber-900">
                                                {currentEditingHistory.length > 0 ? currentEditingHistory.map((item, idx) => (
                                                    <div key={idx} className="flex justify-between items-center bg-white p-2.5 rounded-xl border border-amber-100 shadow-sm">
                                                        <div>
                                                            <p className="font-bold text-amber-900">{item.action}</p>
                                                            {item.note && <p className="text-[11px] text-amber-800/70">{item.note}</p>}
                                                            <p className="text-[10px] text-amber-600/75">{item.time || ''}</p>
                                                        </div>
                                                    </div>
                                                )) : <div className="text-amber-600/70 text-center py-1">尚無詳細異動紀錄</div>}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                
                                <div className="p-4 bg-[#FDF8ED] border-t border-amber-100 shrink-0 flex justify-center">
                                    <button 
                                        type="submit"
                                        onClick={saveYarn}
                                        className="w-full max-w-xs py-3 rounded-2xl font-bold text-amber-900 bg-amber-400 hover:bg-amber-500 transition-all shadow-md shadow-amber-200 text-sm"
                                    >
                                        保存
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        setTimeout(() => lucide.createIcons(), 100);
    </script>
</body>
</html>
