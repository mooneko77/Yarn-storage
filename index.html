<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保在手機上完美滿版，並支援加到主畫面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>毛線倉庫 - 心水收納版</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDK (v9/v10 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            50: '#FFFAF3',
                            100: '#FFF2E0',
                            200: '#FFE4C4',
                            300: '#FFD399',
                            400: '#FFB84D',
                            500: '#F59E0B',
                            600: '#D97706',
                            800: '#92400E',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F8F9FA;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .cute-shadow {
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
        }
        .cute-modal-shadow {
            box-shadow: 0 10px 30px rgba(146, 64, 14, 0.1);
        }
        
        /* 自訂可愛的捲軸 */
        .cute-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .cute-scroll::-webkit-scrollbar-track {
            background: #FFFFAF3;
            border-radius: 10px;
        }
        .cute-scroll::-webkit-scrollbar-thumb {
            background: #FFE4C4;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 1. Firebase 專屬金鑰設定區 (請勿更動)
        // ==========================================
        const MY_FIREBASE_CONFIG = {
            apiKey: "AIzaSyC9l_XKg0SwD59hquvTfOeFopTCkycM5KQ",
            authDomain: "yarn-storage.firebaseapp.com",
            projectId: "yarn-storage",
            storageBucket: "yarn-storage.firebasestorage.app",
            messagingSenderId: "355907288134",
            appId: "1:355907288134:web:8aa9c0bcef363137415e47"
        };

        const LOCAL_STORAGE_KEY = 'cute_yarn_storage_data';

        let db = null;
        let auth = null;
        let useFirebase = false;

        try {
            firebase.initializeApp(MY_FIREBASE_CONFIG);
            db = firebase.firestore();
            auth = firebase.auth();
            useFirebase = true;
            console.log("Firebase 初始化成功！");
        } catch (error) {
            console.warn("Firebase 初始化失敗，將使用本地儲存模式 (單機版)。", error);
            useFirebase = false;
        }

        // ==========================================
        // 2. 自訂安全的 Icon 元件 (防當機)
        // ==========================================
        const Icon = ({ name, className = "", size = 24 }) => {
            const iconRef = React.useRef(null);
            
            React.useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = ''; // 清空
                    const iconElement = window.lucide.createElement(window.lucide.icons[name]);
                    if (iconElement) {
                        iconElement.setAttribute('width', size);
                        iconElement.setAttribute('height', size);
                        iconElement.setAttribute('class', className);
                        iconRef.current.appendChild(iconElement);
                    }
                }
            }, [name, className, size]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        // ==========================================
        // 3. 主程式元件
        // ==========================================
        function App() {
            const [yarns, setYarns] = React.useState([]);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCategory, setSelectedCategory] = React.useState('全部');
            const [isModalOpen, setIsModalOpen] = React.useState(false);
            const [isImportModalOpen, setIsImportModalOpen] = React.useState(false);
            const [currentYarn, setCurrentYarn] = React.useState(null);
            
            // 表單狀態
            const [formData, setFormData] = React.useState({
                id: '',
                brand: '',
                color: '',
                item: '',
                material: '',
                quantity: 1,
                price: 0,
                imageUrl: '',
                createdAt: new Date().toISOString().split('T')[0],
                history: []
            });

            // 庫存管理狀態
            const [inventoryTab, setInventoryTab] = React.useState('入庫'); // '入庫' 或 '出庫'
            const [inventoryChange, setInventoryChange] = React.useState(1);
            const [inventoryDate, setInventoryDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [inventoryNote, setInventoryNote] = React.useState('');

            // ==========================================
            // 資料載入與同步邏輯
            // ==========================================
            React.useEffect(() => {
                let unsubscribe = null;

                const loadData = async () => {
                    if (useFirebase && auth) {
                        auth.onAuthStateChanged(user => {
                            if (user) {
                                console.log("Firebase 匿名登入成功，開始同步資料...");
                                unsubscribe = db.collection('yarns').onSnapshot(snapshot => {
                                    const data = snapshot.docs.map(doc => ({
                                        id: doc.id,
                                        ...doc.data()
                                    }));
                                    setYarns(data);
                                }, error => {
                                    console.error("讀取資料失敗，請確認 Firestore 規則是否開放！", error);
                                    fallbackToLocal();
                                });
                            } else {
                                auth.signInAnonymously().catch(error => {
                                    console.error("匿名登入失敗：", error);
                                    fallbackToLocal();
                                });
                            }
                        });
                    } else {
                        fallbackToLocal();
                    }
                };

                loadData();
                return () => { if (unsubscribe) unsubscribe(); };
            }, []);

            const fallbackToLocal = () => {
                const localData = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (localData) setYarns(JSON.parse(localData));
            };

            const saveToLocal = (newYarns) => {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(newYarns));
            };

            // ==========================================
            // 分類與統計
            // ==========================================
            const categories = ['全部', ...new Set(yarns.map(y => y.material || '未分類'))];
            
            const filteredYarns = yarns.filter(yarn => {
                const matchSearch = (yarn.brand || '').includes(searchTerm) || 
                                  (yarn.color || '').includes(searchTerm) ||
                                  (yarn.item || '').includes(searchTerm) ||
                                  (yarn.material || '').includes(searchTerm);
                const matchCategory = selectedCategory === '全部' || (yarn.material || '未分類') === selectedCategory;
                return matchSearch && matchCategory;
            });

            const totalItems = yarns.reduce((sum, y) => sum + (Number(y.quantity) || 0), 0);
            const totalValue = yarns.reduce((sum, y) => sum + ((Number(y.quantity) || 0) * (Number(y.price) || 0)), 0);

            // ==========================================
            // 開啟 / 關閉 彈窗
            // ==========================================
            const openModal = (yarn = null) => {
                if (yarn) {
                    setFormData(yarn);
                    setCurrentYarn(yarn);
                } else {
                    const newYarn = {
                        id: Date.now().toString(),
                        brand: '',
                        color: '',
                        item: '',
                        material: '',
                        quantity: 1,
                        price: 0,
                        imageUrl: '',
                        createdAt: new Date().toISOString().split('T')[0],
                        history: []
                    };
                    setFormData(newYarn);
                    setCurrentYarn(null);
                }
                
                // 重置庫存管理表單
                setInventoryTab('入庫');
                setInventoryChange(1);
                setInventoryDate(new Date().toISOString().split('T')[0]);
                setInventoryNote('');
                
                setIsModalOpen(true);
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData({ ...formData, imageUrl: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            // ==========================================
            // 儲存商品
            // ==========================================
            const saveYarn = async () => {
                if (useFirebase && auth && auth.currentUser) {
                    try {
                        await db.collection('yarns').doc(formData.id).set(formData);
                    } catch (error) {
                        console.error("Firebase 儲存失敗", error);
                        alert("雲端儲存失敗，請檢查權限設定！將自動存為單機版。");
                        saveLocalFallback();
                    }
                } else {
                    saveLocalFallback();
                }
                setIsModalOpen(false);
            };

            const saveLocalFallback = () => {
                let newYarns;
                if (currentYarn) {
                    newYarns = yarns.map(y => y.id === formData.id ? formData : y);
                } else {
                    newYarns = [formData, ...yarns];
                }
                setYarns(newYarns);
                saveToLocal(newYarns);
            };

            const deleteYarn = async () => {
                if (!confirm('確定要刪除這個毛線嗎？')) return;
                
                if (useFirebase && auth && auth.currentUser) {
                    try {
                        await db.collection('yarns').doc(formData.id).delete();
                    } catch (error) {
                        console.error("刪除失敗", error);
                    }
                } else {
                    const newYarns = yarns.filter(y => y.id !== formData.id);
                    setYarns(newYarns);
                    saveToLocal(newYarns);
                }
                setIsModalOpen(false);
            };

            // ==========================================
            // 新增庫存異動紀錄
            // ==========================================
            const addHistoryRecord = () => {
                if (inventoryChange <= 0) {
                    alert('請輸入大於 0 的數量！');
                    return;
                }

                const changeAmount = inventoryTab === '入庫' ? inventoryChange : -inventoryChange;
                const newQuantity = Math.max(0, Number(formData.quantity) + changeAmount);
                
                const newRecord = {
                    id: Date.now().toString(),
                    date: inventoryDate,
                    type: inventoryTab, // '入庫' 或 '出庫'
                    amount: changeAmount,
                    note: inventoryNote || (inventoryTab === '入庫' ? '補貨入庫' : '使用出庫')
                };

                setFormData({
                    ...formData,
                    quantity: newQuantity,
                    history: [newRecord, ...(formData.history || [])].sort((a, b) => new Date(b.date) - new Date(a.date))
                });

                // 重置庫存表單
                setInventoryChange(1);
                setInventoryNote('');
            };

            // ==========================================
            // 匯入 Excel (CSV)
            // ==========================================
            const downloadTemplate = () => {
                const headers = ['品牌', '顏色', '品項', '材質', '數量', '單價', '建立日期(YYYY-MM-DD)', '圖片網址(選填)'];
                const csvContent = "\uFEFF" + headers.join(',') + '\n' + '雪球,07天藍,小可愛,冰條線,5,30,2024-01-01,';
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "毛線倉庫匯入範本.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    const text = event.target.result;
                    const rows = text.split('\n').filter(row => row.trim() !== '');
                    const newItems = [];
                    const today = new Date().toISOString().split('T')[0];

                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i].split(',').map(col => col.trim());
                        if (cols.length >= 6) {
                            const qty = parseInt(cols[4]) || 0;
                            const createdDate = cols[6] || today;
                            const item = {
                                id: Date.now().toString() + i,
                                brand: cols[0],
                                color: cols[1],
                                item: cols[2],
                                material: cols[3],
                                quantity: qty,
                                price: parseFloat(cols[5]) || 0,
                                createdAt: createdDate,
                                imageUrl: cols[7] || '',
                                history: [{
                                    id: Date.now().toString() + 'h' + i,
                                    date: createdDate,
                                    type: '入庫',
                                    amount: qty,
                                    note: '透過 Excel 批次匯入初始庫存'
                                }]
                            };
                            newItems.push(item);
                            
                            if (useFirebase && auth && auth.currentUser) {
                                await db.collection('yarns').doc(item.id).set(item);
                            }
                        }
                    }

                    if (!useFirebase) {
                        const merged = [...newItems, ...yarns];
                        setYarns(merged);
                        saveToLocal(merged);
                    }
                    alert(`成功匯入 ${newItems.length} 筆資料！`);
                    setIsImportModalOpen(false);
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen pb-24 max-w-4xl mx-auto md:p-6 p-4">
                    
                    {/* Header 區塊 */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h1 className="text-2xl font-extrabold text-[#7A4B3A] tracking-wide">毛線倉庫</h1>
                        
                        <div className="w-full md:w-auto flex-1 max-w-md bg-white rounded-full flex items-center px-4 py-2.5 cute-shadow border border-theme-100">
                            <Icon name="search" className="text-theme-400 mr-2" size="20" />
                            <input
                                type="text"
                                placeholder="搜尋顏色、品項、品牌、材質..."
                                className="w-full outline-none text-theme-800 placeholder-theme-300 text-sm bg-transparent"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>
                    </div>

                    {/* 統計與動作列 */}
                    <div className="flex flex-wrap items-center gap-3 mb-6">
                        <div className="bg-white px-4 py-2 rounded-2xl flex items-center gap-3 text-sm font-medium cute-shadow border border-theme-100 text-[#9C6644]">
                            <span>共 {totalItems} 件</span>
                            <div className="w-[1px] h-4 bg-theme-200"></div>
                            <span>價值 ¥{totalValue}</span>
                        </div>
                        
                        <button onClick={downloadTemplate} className="bg-white text-theme-500 px-4 py-2 rounded-2xl text-sm font-bold border border-theme-200 hover:bg-theme-50 transition cute-shadow">
                            匯入範本
                        </button>
                        <button onClick={() => setIsImportModalOpen(true)} className="bg-theme-400 text-white px-4 py-2 rounded-2xl text-sm font-bold hover:bg-theme-500 transition cute-shadow">
                            匯入 Excel
                        </button>
                    </div>

                    {/* 材質分類標籤 (水平滑動) */}
                    <div className="flex overflow-x-auto hide-scrollbar gap-3 mb-6 pb-2">
                        {categories.map(category => (
                            <button
                                key={category}
                                onClick={() => setSelectedCategory(category)}
                                className={`whitespace-nowrap px-5 py-2 rounded-full text-sm font-bold transition-all duration-300 ${
                                    selectedCategory === category
                                        ? 'bg-theme-400 text-white cute-shadow transform scale-105'
                                        : 'bg-white text-theme-600 border border-theme-100 hover:bg-theme-50'
                                }`}
                            >
                                {category}
                            </button>
                        ))}
                    </div>

                    {/* 商品網格 - 手機改2欄，平板以上4欄 */}
                    {filteredYarns.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-[32px] cute-shadow border border-theme-100">
                            <Icon name="package-open" size="48" className="mx-auto text-theme-200 mb-4" />
                            <p className="text-[#9C6644] font-medium text-lg">倉庫空空的</p>
                            <p className="text-theme-400 text-sm mt-2">點擊右下角新增，或使用 Excel 批次匯入資料。</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            {filteredYarns.map(yarn => (
                                <div key={yarn.id} 
                                     onClick={() => openModal(yarn)}
                                     className="bg-white rounded-[24px] p-3 flex flex-col items-center cute-shadow border border-theme-50 cursor-pointer hover:shadow-lg transition-shadow">
                                    
                                    {/* 圖片區塊：修正iOS Safari的歪斜問題 */}
                                    <div className="w-full aspect-square bg-[#FFF8E7] rounded-[16px] overflow-hidden relative border border-theme-100">
                                        {/* 單價標籤 */}
                                        <div className="absolute top-2 left-2 bg-[#95C076] text-white text-xs font-bold px-2 py-1 rounded-full z-10 border-2 border-white shadow-sm">
                                            ¥{yarn.price}
                                        </div>
                                        
                                        {/* 圖片 */}
                                        {yarn.imageUrl ? (
                                            <img src={yarn.imageUrl} alt={yarn.color} className="absolute inset-0 w-full h-full object-cover object-center" />
                                        ) : (
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <Icon name="image" size="32" className="text-theme-200" />
                                            </div>
                                        )}

                                        {/* 總數量標籤 */}
                                        <div className="absolute bottom-2 right-2 bg-theme-400 text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full z-10 border-2 border-white shadow-sm">
                                            {yarn.quantity}
                                        </div>
                                    </div>

                                    {/* 資訊區塊 (顏色在上，品牌與品項在下並排) */}
                                    <div className="mt-3 text-left w-full px-1">
                                        <h3 className="text-[17px] font-extrabold text-[#7A4B3A] mb-1.5 truncate">{yarn.color || '未命名顏色'}</h3>
                                        <div className="flex items-center flex-wrap gap-1.5">
                                            <span className="text-sm text-[#9C6644] font-medium">{yarn.brand || '未命名品牌'}</span>
                                            <span className="px-2 py-0.5 bg-[#FFF2E0] text-[#B87A5D] text-[11px] rounded-full truncate max-w-[90px]">{yarn.item || '未分類'}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* 懸浮新增按鈕 (放大) */}
                    <button
                        onClick={() => openModal()}
                        className="fixed bottom-8 right-8 bg-theme-400 text-white w-16 h-16 rounded-full flex items-center justify-center cute-shadow hover:bg-theme-500 hover:scale-105 transition-all z-40 border-4 border-white shadow-[0_4px_20px_rgba(245,158,11,0.3)]"
                    >
                        <Icon name="plus" size="32" />
                    </button>

                    {/* ========================================== */}
                    {/* 編輯 / 新增 彈窗 */}
                    {/* ========================================== */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-[#FFF8E7] w-full max-w-md rounded-[32px] overflow-hidden flex flex-col max-h-[90vh] cute-modal-shadow border border-[#FFE4C4]">
                                
                                {/* 標題列 */}
                                <div className="p-4 flex justify-between items-center border-b border-[#FFE4C4] bg-[#FFF8E7] shrink-0">
                                    <h2 className="text-lg font-bold text-[#7A4B3A]">
                                        {currentYarn ? '物品詳情' : '新增物品'}
                                    </h2>
                                    <div className="flex gap-3">
                                        {currentYarn && (
                                            <button onClick={deleteYarn} className="text-red-400 hover:text-red-500 transition">
                                                <Icon name="trash-2" size="22" />
                                            </button>
                                        )}
                                        <button onClick={() => setIsModalOpen(false)} className="text-[#D97706] hover:text-[#92400E] transition">
                                            <Icon name="x" size="26" />
                                        </button>
                                    </div>
                                </div>

                                {/* 內容捲動區 */}
                                <div className="p-5 overflow-y-auto cute-scroll flex-1">
                                    
                                    {/* 圖片上傳 (方正置中圓角) */}
                                    <div className="flex justify-center mb-6">
                                        <div className="relative w-32 h-32 bg-white rounded-[24px] border-2 border-dashed border-theme-300 flex items-center justify-center overflow-hidden group">
                                            {formData.imageUrl ? (
                                                <img src={formData.imageUrl} alt="preview" className="w-full h-full object-cover object-center" />
                                            ) : (
                                                <div className="text-center text-theme-400">
                                                    <Icon name="image-plus" size="28" className="mx-auto mb-1 opacity-50" />
                                                    <span className="text-xs font-medium">上傳照片</span>
                                                </div>
                                            )}
                                            <input type="file" accept="image/*" onChange={handleImageUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                        </div>
                                    </div>

                                    {/* 基礎資料表單 */}
                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        <div>
                                            <label className="block text-xs font-bold text-[#9C6644] mb-1.5 ml-1">品牌</label>
                                            <input type="text" value={formData.brand} onChange={e => setFormData({...formData, brand: e.target.value})} className="w-full bg-white rounded-2xl px-4 py-2.5 text-sm outline-none border border-theme-100 focus:border-theme-300 text-[#7A4B3A]" placeholder="請輸入品牌" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-[#9C6644] mb-1.5 ml-1">顏色</label>
                                            <input type="text" value={formData.color} onChange={e => setFormData({...formData, color: e.target.value})} className="w-full bg-white rounded-2xl px-4 py-2.5 text-sm outline-none border border-theme-100 focus:border-theme-300 text-[#7A4B3A]" placeholder="請輸入顏色" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-[#9C6644] mb-1.5 ml-1">品項</label>
                                            <input type="text" value={formData.item} onChange={e => setFormData({...formData, item: e.target.value})} className="w-full bg-white rounded-2xl px-4 py-2.5 text-sm outline-none border border-theme-100 focus:border-theme-300 text-[#7A4B3A]" placeholder="請輸入品項" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-[#9C6644] mb-1.5 ml-1">材質</label>
                                            <input type="text" value={formData.material} onChange={e => setFormData({...formData, material: e.target.value})} className="w-full bg-white rounded-2xl px-4 py-2.5 text-sm outline-none border border-theme-100 focus:border-theme-300 text-[#7A4B3A]" placeholder="請輸入材質" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-[#9C6644] mb-1.5 ml-1">單價 (¥)</label>
                                            <input type="number" min="0" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} className="w-full bg-white rounded-2xl px-4 py-2.5 text-sm outline-none border border-theme-100 focus:border-theme-300 text-[#7A4B3A]" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-[#9C6644] mb-1.5 ml-1">建立日期</label>
                                            <input type="date" value={formData.createdAt} onChange={e => setFormData({...formData, createdAt: e.target.value})} className="w-full bg-white rounded-2xl px-4 py-2.5 text-sm outline-none border border-theme-100 focus:border-theme-300 text-[#7A4B3A]" />
                                        </div>
                                    </div>

                                    {/* 心水收納風格 - 庫存管理區塊 */}
                                    <div className="bg-white rounded-[24px] border border-theme-100 p-4 mb-6">
                                        <div className="text-center font-bold text-[#7A4B3A] mb-4">庫存管理</div>
                                        
                                        {/* 分頁 Tab */}
                                        <div className="flex gap-2 mb-4 border-b border-theme-100 pb-2">
                                            <button onClick={() => setInventoryTab('入庫')} className={`px-4 py-1.5 rounded-t-xl text-sm font-bold transition ${inventoryTab === '入庫' ? 'bg-theme-100 text-theme-600' : 'text-gray-400'}`}>入庫</button>
                                            <button onClick={() => setInventoryTab('出庫')} className={`px-4 py-1.5 rounded-t-xl text-sm font-bold transition ${inventoryTab === '出庫' ? 'bg-theme-100 text-theme-600' : 'text-gray-400'}`}>出庫</button>
                                        </div>

                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center bg-theme-50 rounded-2xl p-3">
                                                <span className="text-sm text-[#9C6644] font-bold">
                                                    庫存 ( {formData.quantity} → {inventoryTab === '入庫' ? Number(formData.quantity) + Number(inventoryChange) : Math.max(0, Number(formData.quantity) - Number(inventoryChange))} )
                                                </span>
                                                <div className="flex items-center gap-3 bg-white px-2 py-1 rounded-xl border border-theme-100">
                                                    <button onClick={() => setInventoryChange(Math.max(1, inventoryChange - 1))} className="text-theme-400 font-bold px-2">-</button>
                                                    <span className="text-theme-600 font-bold min-w-[1.5rem] text-center">{inventoryChange}</span>
                                                    <button onClick={() => setInventoryChange(inventoryChange + 1)} className="text-theme-400 font-bold px-2">+</button>
                                                    <span className="text-sm text-[#9C6644]">件</span>
                                                </div>
                                            </div>

                                            <div className="flex justify-between items-center bg-theme-50 rounded-2xl p-3">
                                                <span className="text-sm text-[#9C6644] font-bold">日期</span>
                                                <input type="date" value={inventoryDate} onChange={(e) => setInventoryDate(e.target.value)} className="bg-transparent text-theme-600 font-bold outline-none text-right text-sm" />
                                            </div>

                                            <input type="text" value={inventoryNote} onChange={(e) => setInventoryNote(e.target.value)} placeholder="說明請戳這裡~" className="w-full bg-theme-50 rounded-2xl p-3 text-sm outline-none text-theme-600 placeholder-theme-300" />
                                            
                                            <button onClick={addHistoryRecord} className="w-full py-2.5 bg-theme-100 text-theme-600 rounded-2xl font-bold text-sm hover:bg-theme-200 transition">
                                                加入紀錄
                                            </button>
                                        </div>
                                    </div>

                                    {/* 歷史異動紀錄清單 */}
                                    {formData.history && formData.history.length > 0 && (
                                        <div className="mb-4">
                                            <div className="text-xs font-bold text-theme-400 mb-2 ml-2">異動紀錄</div>
                                            <div className="space-y-2">
                                                {formData.history.map(record => (
                                                    <div key={record.id} className="bg-white p-3 rounded-2xl border border-theme-50 flex justify-between items-center text-sm">
                                                        <div>
                                                            <div className="font-bold text-[#7A4B3A]">{record.note}</div>
                                                            <div className="text-xs text-theme-300">{record.date}</div>
                                                        </div>
                                                        <div className={`font-bold ${record.amount > 0 ? 'text-[#95C076]' : 'text-red-400'}`}>
                                                            {record.amount > 0 ? '+' : ''}{record.amount}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                </div>

                                {/* 底部保存按鈕 */}
                                <div className="p-4 bg-[#FFF8E7] border-t border-[#FFE4C4] shrink-0">
                                    <button 
                                        onClick={saveYarn}
                                        className="w-full bg-theme-400 text-white py-3.5 rounded-[20px] font-extrabold text-[15px] cute-shadow hover:bg-theme-500 transition-colors"
                                    >
                                        保存
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================== */}
                    {/* CSV 匯入視窗 */}
                    {/* ========================================== */}
                    {isImportModalOpen && (
                        <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-[#FFF8E7] w-full max-w-sm rounded-[32px] p-6 cute-modal-shadow relative border border-[#FFE4C4]">
                                <button onClick={() => setIsImportModalOpen(false)} className="absolute top-4 right-4 text-theme-400">
                                    <Icon name="x" size="24" />
                                </button>
                                <h3 className="text-lg font-bold text-[#7A4B3A] mb-4 text-center">批次匯入 Excel (CSV)</h3>
                                
                                <div className="bg-white p-4 rounded-2xl text-sm text-[#9C6644] mb-4 border border-theme-100">
                                    <p className="font-bold mb-2 text-theme-500">支援欄位順序：</p>
                                    <p className="mb-2">品牌, 顏色, 品項, 材質, 數量, 單價, 建立日期, 圖片網址</p>
                                    <p className="text-xs text-theme-400">請先點擊首頁的「匯入範本」下載格式，填寫後上傳 CSV 檔案。</p>
                                </div>

                                <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-theme-300 border-dashed rounded-2xl cursor-pointer bg-white hover:bg-theme-50 transition">
                                    <div className="flex flex-col items-center justify-center pt-5 pb-6 text-theme-400">
                                        <Icon name="upload-cloud" size="32" className="mb-2" />
                                        <p className="text-sm font-bold">點擊選擇 CSV 檔案</p>
                                    </div>
                                    <input type="file" className="hidden" accept=".csv" onChange={handleFileUpload} />
                                </label>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
